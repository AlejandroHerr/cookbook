services:
  db:
    image: postgres:latest
    restart: unless-stopped
    ports:
      - ${POSTGRES_PORT}:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
  migrate:
    image: migrate/migrate
    command: -path=/migrations/ -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable up
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
  drop:
    image: migrate/migrate
    command: -path=/migrations/ -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable drop -f
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
volumes:
  pgdata:
