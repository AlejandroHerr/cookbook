version: "2"
sql:
  - engine: "postgresql"
    queries:
      - "./internal/sql/recipes.sql"
      - "./internal/sql/suggestions.sql"
    schema: "migrations"
    gen:
      go:
        package: "sql"
        out: "internal/sql"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        emit_methods_with_db_argument: true
        overrides:
          - db_type: "uuid"
            go_type: "string"
